<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Memories</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>My Memories</h1>
    <form method="get" action="/">
      <input type="search" name="q" value="{{search}}" placeholder="Search memories, projects, websites">
      <button type="submit">Search</button>
    </form>
    <p class="count">{{count}} memories</p>
  </header>

  <main>
    {{memories}}
  </main>
</body>
</html>
